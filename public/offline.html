  <button id="r" onclick="location.reload()">Try again</button>
<script>
/* The language the app was last used in, so somebody who reads Arabic is not
   handed English at the one moment the app cannot ask them anything. */
(function () {
  var lang = null;
  try { var s = localStorage.getItem("lateen_lang"); if (s === "ar" || s === "en") lang = s; } catch (e) {}
  if (!lang) { try { lang = (navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en"; } catch (e) { lang = "en"; } }
  if (lang !== "ar") return;
  document.documentElement.lang = "ar";
  document.documentElement.dir = "rtl";
  document.getElementById("t").textContent = "ما فيش اتصال بالإنترنت";
  document.getElementById("b").textContent = "تأكد من الاتصال وحاول مرة أخرى.";
  document.getElementById("r").textContent = "حاول مرة أخرى";
})();
/* Come back on its own the moment the connection returns. */
addEventListener("online", function () { location.reload(); });
</script>
