<html lang="en">

<title>Wasla</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 24px; background: #080808; color: #f0eeeb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
  }
  /* No card, no frame — the logo sits on the page the way it does on the
     splash. A box around it was the browser's own offline screen, not ours. */
  svg { width: min(58vw, 220px); height: auto; }
  h1 { margin: 0; font-size: 17px; font-weight: 500; }
  p { margin: 0; font-size: 13px; line-height: 1.6; color: #9e9b97; max-width: 30ch; }
  button {
    margin-top: 4px; height: 44px; padding: 0 26px; border: none; border-radius: 14px;
    background: #f0eeeb; color: #080808; font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div>
    <h1 id="t">You're offline</h1>
    <p id="b">Check your connection and try again.</p>
  </div>
  <button id="r" onclick="location.reload()">Try again</button>
<script>
/* The language the app was last used in, so somebody who reads Arabic is not
   handed English at the one moment the app cannot ask them anything. */
(function () {
  var lang = null;
  try { var s = localStorage.getItem("lateen_lang"); if (s === "ar" || s === "en") lang = s; } catch (e) {}
  if (!lang) { try { lang = (navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en"; } catch (e) { lang = "en"; } }
  if (lang !== "ar") return;
  document.documentElement.lang = "ar";
  document.documentElement.dir = "rtl";
  document.getElementById("t").textContent = "ما فيش اتصال بالإنترنت";
  document.getElementById("b").textContent = "تأكد من الاتصال وحاول مرة أخرى.";
  document.getElementById("r").textContent = "حاول مرة أخرى";
})();
/* Come back on its own the moment the connection returns. */
addEventListener("online", function () { location.reload(); });
</script>
